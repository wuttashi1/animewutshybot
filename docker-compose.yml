# YummyAnime Discord-бот
#
# Способ A — clone с GitHub и локальная сборка (работает сразу):
#   git clone https://github.com/wuttashi1/animewutshybot.git
#   cd animewutshybot && git checkout cursor/docker-casaos-c91d
#   mkdir -p data && docker compose up -d --build
#
# Способ B — CasaOS UI: используйте docker-compose.casaos.yml
#   (образ ghcr.io/wuttashi1/animewutshybot:latest после CI)

services:
  anime-bot:
    build: .
    image: ghcr.io/wuttashi1/animewutshybot:latest
    container_name: animewutshybot
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: "MTQ3Mjc0ODkzNzk1Mjc1NTk0MA.GpGemF.Jx31VBOQAisFq8OTu2vZYyLMho-HGE3RrCbpdk"
      DISCORD_GUILD_ID: "1039083119250264085"
      YUMMY_APPLICATION_TOKEN: "Sisf4i6dh12hef_2"
      DISCORD_BOT_OWNER_ID: "316978986926342153"
      DISCORD_MESSAGE_CONTENT_INTENT: "0"
      YUMMY_SYNC_INTERVAL_SEC: "600"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
