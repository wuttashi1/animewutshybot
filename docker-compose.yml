# YummyAnime Discord-бот — Docker / CasaOS
#
# Быстрый старт:
#   1. Положите рядом файл .env (см. ниже)
#   2. mkdir -p data
#   3. docker compose up -d --build
#   4. docker compose logs -f

services:
  anime-bot:
    build: .
    image: animewutshybot:latest
    container_name: animewutshybot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
