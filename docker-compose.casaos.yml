# CasaOS Custom Install — только pull образа (без build).
# Образ публикуется GitHub Actions в GHCR:
#   ghcr.io/wuttashi1/animewutshybot:latest
#
# Перед установкой на хосте CasaOS (один раз), если пакет приватный:
#   echo ghp_ВАШ_ТОКЕН | docker login ghcr.io -u ВАШ_ЛОГИН --password-stdin
# PAT scopes: read:packages (+ repo, если пакет привязан к приватному репо)

services:
  anime-bot:
    image: ghcr.io/wuttashi1/animewutshybot:latest
    container_name: animewutshybot
    restart: unless-stopped
    pull_policy: always
    environment:
      DISCORD_BOT_TOKEN: "MTQ3Mjc0ODkzNzk1Mjc1NTk0MA.GpGemF.Jx31VBOQAisFq8OTu2vZYyLMho-HGE3RrCbpdk"
      DISCORD_GUILD_ID: "1039083119250264085"
      YUMMY_APPLICATION_TOKEN: "Sisf4i6dh12hef_2"
      DISCORD_BOT_OWNER_ID: "316978986926342153"
      DISCORD_MESSAGE_CONTENT_INTENT: "0"
      YUMMY_SYNC_INTERVAL_SEC: "600"
    volumes:
      - /DATA/AppData/animewutshybot/data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
